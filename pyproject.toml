[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-regression-guard"
version = "0.2.0"
description = "A small CLI for OpenAPI-driven API regression checks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
arguard = "api_regression_guard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
